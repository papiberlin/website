---
layout: default
---

<!-- Begin List Posts
================================================== -->
<section class="row recent-posts">
    <div class="col-md-8 col-lg-8">
        <div class="section-title">
            <h2>
                <span>
                    {{ "archive.category" | t }}
                    '{{ page.title }}'
                </span>
            </h2>
        </div>
        <div class="masonrygrid row listrecent">

            {% for post in page.posts %}

            {% render "postbox", post: post, site: site %}

            {% endfor %}

        </div>
    </div>

    <div class="col-md-4 col-lg-4">
        {% render "sidebar" %}
    </div>
</section>
